{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Conversation Manager</title>
  <link rel="stylesheet" href="{% static 'conversations/fonts/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'conversations/playground.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="kicker"><span class="stage-tile">4</span>Session &amp; conversation management</p>
    <h1>Sign in</h1>
    {% if form.errors %}<p class="banner is-error">That username and password did not match.</p>{% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" name="username" autocomplete="username" required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="primary">Sign in</button>
    </form>
    <p class="hint">Demo users: <code>alice</code> and <code>bob</code>, password <code>demo-password-123</code> (create them with <code>python manage.py create_demo_users</code>).</p>
  </main>
</body>
</html>
